<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticate 2026 | Death to Passwords</title>
  <!-- party.css is the shared theme (background, top bar, sponsor strip);
       landing.css adds this page's hero and games panel -->
  <link rel="stylesheet" href="./party.css">
  <link rel="stylesheet" href="./landing.css">
</head>
<body class="party">

  <!-- Top bar -->
  <div class="topbar">
    <div class="container">
      <span class="brand">Authenticate 2026 • Death to Passwords</span>
    </div>
  </div>

  <!-- Sponsor strip: the same logos the partner booths use -->
  <section class="sponsors" aria-label="Partners and sponsors">
    <div class="sponsor-track">
      <img src="./partners/swissbit.png" alt="Swissbit" class="logo-swissbit">
      <img src="./partners/hid.png" alt="HID" class="logo-hid">
      <img src="./partners/google.png" alt="Google" class="logo-google">
      <img src="./partners/rsa.png" alt="RSA" class="logo-rsa">
    </div>
  </section>

  <main>
    <!-- Hero: the neon sign and the two links -->
    <section class="hero">
      <div class="container">
        <div class="welcome">
          <p class="eyebrow">Authenticate 2026 · <img src="./landing/fido-alliance.png" alt="FIDO Alliance"></p>
          <h1 class="sign"><img src="./landing/neon-sign.png" alt="Death to Passwords" width="1280" height="720"></h1>
          <p class="intro">Your FIDO key is your ticket. Step inside.</p>
          <nav class="links" aria-label="Site navigation">
            <a class="party-btn" href="./index.html">Login <span aria-hidden="true">→</span></a>
            <a class="party-btn party-btn-alt" href="https://sbit.authconcepts.com:3099/dashboard.html">Leader Board</a>
          </nav>
        </div>
      </div>
    </section>

    <!-- The games: how to play goes here once the text arrives -->
    <section class="container games" id="games">
      <div class="panel">
        <h2>The Games</h2>
        <p>How to play, and what your points are good for, is coming soon.</p>
      </div>
    </section>
  </main>

</body>
</html>
